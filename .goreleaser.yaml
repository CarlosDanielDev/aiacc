# GoReleaser configuration for aiacc.
# Docs: https://goreleaser.com
version: 2

project_name: aiacc

before:
  hooks:
    - go mod tidy

builds:
  - id: aiacc
    main: .
    binary: aiacc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/CarlosDanielDev/aiacc/internal/cli.version={{.Version}}

archives:
  - id: aiacc
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Homebrew publishing is deferred until a HOMEBREW_TAP_GITHUB_TOKEN secret exists
# on the repo. Re-add via `homebrew_casks:` (the `brews:` key is deprecated in
# GoReleaser v2) pointing at the CarlosDanielDev/homebrew-tap repository once the
# token is set, so the release job can push the formula/cask.

release:
  github:
    owner: CarlosDanielDev
    name: aiacc
